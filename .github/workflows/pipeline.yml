name: Pipeline

on:
  push:
  pull_request:
    types: [opened]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v3

      - name: setup python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: install dependencies
        run: |
          pip install -r requirements-dev.txt
          sudo apt-get install ffmpeg

      - name: flake8
        run: flake8

      - name: test
        run: |
          mkdir -p .config
          pytest
