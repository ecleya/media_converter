[flake8]
exclude =
    __init__.py
    .direnv
max-line-length=120

[tool:pytest]
addopts =
    -m "not externals"
    --maxfail=1
    --cov .
    --cov-branch
    --cov-report xml
    --cov-report=term-missing
env =
    WORKBENCH=/tmp
log_level=CRITICAL
markers =
    externals
norecursedirs =
    .pytest_cache

[tool:autopep8]
max-line-length=120

[coverage:run]
omit =
    */tests/*

[coverage:report]
exclude_lines =
    def __str__
    raise NotImplementedError
